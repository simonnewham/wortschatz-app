name: Build & Test Validation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-server:
    name: Build .NET Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x' # Falls back seamlessly if other versions are used

      - name: Restore dependencies
        run: dotnet restore WortschatzWebApi.sln

      - name: Build Server
        run: dotnet build WortschatzWebApi.sln --configuration Release --no-restore

      - name: Test Server
        run: dotnet test WortschatzWebApi.sln --configuration Release --no-build --verbosity normal

  build-client:
    name: Build React Native Client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Client

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript Compilation
        run: npx tsc --noEmit
